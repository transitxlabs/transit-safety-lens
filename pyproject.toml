[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-safety-lens"
version = "0.1.0"
description = "Reproducible quality and change analysis of public transit safety records"
requires-python = ">=3.14"
dependencies = ["numpy==2.5.4", "pandas==3.0.6", "scipy==1.18.1", "openpyxl==3.1.5", "reportlab==5.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0", "pandas-stubs==3.0.5.260914"]

[project.scripts]
transit-safety-lens = "transit_safety_lens.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
