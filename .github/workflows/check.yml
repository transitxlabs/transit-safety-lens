name: checks
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: sudo unshare --net env PATH="$PATH" make check
